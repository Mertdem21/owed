# Render Blueprint: one free web service running the Owed agent + UI.
# Keys are not stored here: after the first deploy, add them under Environment -> "Add from .env".
services:
  - type: web
    name: owed
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --extra sponsors
    startCommand: .venv/bin/uvicorn owed.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEMO_TODAY
        value: "2026-11-20"
