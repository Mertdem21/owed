[project]
name = "owed"
version = "0.1.0"
description = "Owed - a personal agent that gets your money back after you shop, with a full audit trail."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Sponsor SDKs. Install with:  uv sync --extra sponsors
# If one of them fails to resolve, delete that line and run uv sync again -
# every integration falls back gracefully when its SDK is missing.
sponsors = [
    "singlestoredb>=1.0",
    "amplitude-analytics>=1.1",
    "amplitude-ai>=1.0",
    "sie-sdk",
    "airbyte-agent-gmail",
]

[tool.uv]
package = false
